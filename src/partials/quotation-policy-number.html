<container>
  <row class="collapse" >
    <columns small="12" >
      <callout class="primary">
        <p class="text-center mb-0 text-white">
          {{{text}}}
        </p>

        <p class="text-center font-size-20px text-white mb-0">
          <strong>
            {{quotation_number}}
          </strong>
        </p>

        {{#if valid_until}}
          <spacer size="16"> </spacer>

          <p class="text-center text-white mb-0">
            {{{valid_text}}}
          </p>

          <p class="text-center font-size-20px text-white mb-0">
            <strong>
              {{valid_until}}
            </strong>
          </p>
        {{/if}}
      </callout>
    </columns>
  </row>
</container>
